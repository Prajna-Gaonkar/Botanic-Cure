<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <title>Login | Botanic Cure</title>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="header">
                <span class="icon">🍃</span>
                Botanic Cure
            </div>

            <div class="login-header">
                <header>Login</header>
            </div>

            <!-- ✅ LOGIN FORM -->
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="input-box">
                    <input type="email" name="email" id="email" class="input-field" placeholder="Email" autocomplete="off" required>
                </div>

                <div class="input-box">
                    <input type="password" name="password" id="password" class="input-field" placeholder="Password" autocomplete="off" required>
                </div>

                <div class="forgot">
                    <section>
                        <input type="checkbox" id="check">
                        <label for="check">Remember me</label>
                    </section>
                    <section>
                        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
                    </section>
                </div>

                <div class="input-submit">
                    <button type="submit" class="submit-btn">Sign In</button>
                </div>
            </form>
            <!-- ✅ END LOGIN FORM -->

            <div class="sign-up-link">
                <p>Don't have an account? 
                    <a href="{{ url_for('auth.register') }}" class="text-green-600 hover:text-green-800">Sign Up</a>
                </p>
                <p class="mt-2">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-sm text-green-600 hover:text-green-800">Forgot Password?</a>
                </p>
            </div>

            <!-- ✅ Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="flash-messages">
                  {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
