<!doctype html>
<html><body>
  <h2>Result</h2>
  <p><strong>Prediction:</strong> {{ label }}</p>
  <p><strong>Confidence:</strong> {{ '%.2f'|format(confidence*100) }}%</p>
  {% if info %}
    <h3>Plant information</h3>
    <p><strong>Botanical name:</strong> {{ info.botanical }}</p>
    <p><strong>Medicinal uses:</strong> {{ info.uses }}</p>
    <p><strong>Growing areas:</strong> {{ info.growing_areas }}</p>
  {% else %}
    <p>No plant information available.</p>
  {% endif %}
  <img src="{{ img_url }}" width="300">
  <p><a href="{{ url_for('index') }}">Try another</a></p>
</body></html>
